[pytest]
# The `integration` marker guards the real-GEE suite (network + credentials).
# `addopts` excludes it by default so `pytest` is green offline / in CI; the
# live suite runs only via `pytest -m integration` on the Windows host (M10).
markers =
    integration: real Google Earth Engine tests — network + creds, never in CI
addopts = -m "not integration"
testpaths = tests
