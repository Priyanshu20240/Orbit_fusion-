# Orbiter Fusion — CI
#
# M10 — phased rollout:
#   • backend-unit   — runs on every push/PR to main. Pytest, no GEE.
#   • frontend-unit  — runs on every push/PR to main. Vitest + coverage gate.
#   • backend-live   — ON-DEMAND (workflow_dispatch). Real GEE, -m integration.
#                      Requires the secrets named below.
#   • e2e            — ON-DEMAND (workflow_dispatch). Playwright happy-path
#                      against a built frontend + live backend. Same secrets
#                      as backend-live plus a runner that can run a browser.
#
# Why split live + e2e into on-demand jobs? They need real Earth Engine
# credentials and run for minutes. Putting them on the push pipeline
# would (a) blow through the free GEE quota, (b) flake on transient
# network errors, and (c) take 5–10 min on every PR. The on-demand
# model keeps push CI under 90s while still letting the operator
# validate the full stack before a release.
#
# Required secrets (workflow_dispatch jobs only):
#   ORBITER_GEE_PROJECT          — GCS / EE project id (string)
#   ORBITER_GEE_SERVICE_ACCOUNT_JSON — service-account JSON (multiline)
#
# The service-account JSON is written to a tmp file in the runner and
# loaded via GOOGLE_APPLICATION_CREDENTIALS so the EE SDK picks it up
# via the same path the local `earthengine authenticate` uses.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      job:
        description: "Which on-demand job to run"
        type: choice
        required: true
        default: backend-live
        options:
          - backend-live
          - e2e

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  # ────────────────────────────────────────────────────────────────────
  # Every push: backend unit tests (no GEE, fast)
  # ────────────────────────────────────────────────────────────────────
  backend-unit:
    name: Backend unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-cov
      - name: Run tests
        env:
          ORBITER_GEE_PROJECT: ci-stub-project
        run: pytest -m "not integration" --cov=app --cov-report=term-missing --cov-fail-under=70

  # ────────────────────────────────────────────────────────────────────
  # Every push: frontend unit tests (vitest, no network)
  # ────────────────────────────────────────────────────────────────────
  frontend-unit:
    name: Frontend unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install deps
        run: npm ci
      - name: Run tests with coverage
        run: npm run test:cov

  # ────────────────────────────────────────────────────────────────────
  # On-demand: live Earth Engine smoke (network + GEE creds)
  # ────────────────────────────────────────────────────────────────────
  backend-live:
    name: Backend live GEE (-m integration)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.job == 'backend-live'
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Write service-account JSON
        if: ${{ secrets.ORBITER_GEE_SERVICE_ACCOUNT_JSON != '' }}
        env:
          SA_JSON: ${{ secrets.ORBITER_GEE_SERVICE_ACCOUNT_JSON }}
        run: |
          mkdir -p /tmp/ee
          echo "$SA_JSON" > /tmp/ee/sa.json
      - name: Run live GEE smoke
        env:
          ORBITER_GEE_PROJECT: ${{ secrets.ORBITER_GEE_PROJECT }}
          ORBITER_GEE_LIVE: "1"
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/ee/sa.json
        run: pytest -m integration -v

  # ────────────────────────────────────────────────────────────────────
  # On-demand: E2E happy-path (Playwright + live backend + live GEE)
  # ────────────────────────────────────────────────────────────────────
  e2e:
    name: E2E happy-path
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.job == 'e2e'
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install backend deps
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Write service-account JSON
        if: ${{ secrets.ORBITER_GEE_SERVICE_ACCOUNT_JSON != '' }}
        env:
          SA_JSON: ${{ secrets.ORBITER_GEE_SERVICE_ACCOUNT_JSON }}
        run: |
          mkdir -p /tmp/ee
          echo "$SA_JSON" > /tmp/ee/sa.json
      - name: Install frontend deps
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Build frontend
        run: npm run build
      - name: Start backend (background)
        working-directory: backend
        env:
          ORBITER_GEE_PROJECT: ${{ secrets.ORBITER_GEE_PROJECT }}
          ORBITER_GEE_LIVE: "1"
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/ee/sa.json
        run: |
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/backend.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/health > /dev/null && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/health
      - name: Run Playwright
        env:
          E2E_PORT: "5173"
        run: npm run e2e
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
